name: 更新族谱

# 每月 1 号自动从 Google 表格（sheet_url.txt 里的链接）更新；
# 也可以在 Actions 页面点 "Run workflow" 立即更新；
# 修改 sheet_url.txt 时也会运行。
# 名单有变化时，data.js 和 族谱备份.xlsx 会一起更新。
on:
  schedule:
    - cron: "0 2 1 * *"
  push:
    branches: [main]
    paths: [sheet_url.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: 生成 data.js（表格有错误时这一步会失败并列出问题）
        run: python build_data.py
      - name: 提交
        run: |
          # .last_sync 每月更新一次：仓库超过 60 天没有任何提交时，GitHub 会停用定时任务
          date -u +%F > .last_sync
          git add data.js 族谱备份.xlsx .last_sync
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新族谱（$(date -u +%F)）"
          git push
